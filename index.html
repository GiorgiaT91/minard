<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaves before the frost</title>
<meta name="description" content="422,000 men marched into Russia in 1812. Four in five vanished before the first frost. A redrawing of Minard’s chart, one leaf for every 10,000 men.">
<link rel="canonical" href="https://giorgiat91.github.io/minard/">
<meta property="og:type" content="website">
<meta property="og:title" content="Leaves before the frost">
<meta property="og:description" content="422,000 men marched into Russia in 1812. Four in five vanished before the first frost. A redrawing of Minard’s chart, one leaf for every 10,000 men.">
<meta property="og:url" content="https://giorgiat91.github.io/minard/">
<meta property="og:image" content="https://giorgiat91.github.io/minard/anteprima.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A plant losing its leaves inside a calendar ring: each leaf is 10,000 men of Napoleon’s army in 1812.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --ink: #2B2620;
    --ink-muted: #6E665B;
    --rule: #D9D2C3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Martel Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main {
    max-width: 632px;
    margin: 0 auto;
    padding: 16px 16px 32px;
  }
  /* capitoli (decisioni del 2 novembre): una riga di date sotto i controlli, fuori dalla scena.
     Testo semplice senza bordo; il capitolo in corso è inchiostro e grassetto, gli altri muted.
     Su telefono le date vanno a capo dentro .chapters-list: la seconda riga parte sotto la
     prima data (24 Jun) e forma una colonna con la prima; l'etichetta "Key moments:" resta a
     sinistra della prima riga. Su desktop etichetta + date stanno su una riga, centrata.
     Etichetta e date sono allineate sulla linea di base del testo (align-items: baseline). */
  #chapters {
    --chapter-tap: 44px;        /* altezza dell'area di tocco di ogni capitolo */
    --chapter-row-overlap: 6px; /* telefono: quanto le aree di tocco di due righe si sovrappongono (per lato) */
    display: flex;
    align-items: baseline;
    justify-content: center;
    max-width: 600px;
    margin: 4px auto 0;
    font-size: 0.85rem;     /* ≈ 13,6 px: mai sotto i 12 px */
  }
  #chapters[hidden], body.video #chapters { display: none; }
  #chapters .chapters-label {
    flex: none;
    color: var(--ink-muted);
    font-weight: 400;
    margin-right: 4px;
  }
  #chapters .chapters-list {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 2px;
    min-width: 0;           /* può stringersi sotto la larghezza di una riga sola: allora va a capo */
  }
  #chapters button {
    font: inherit;
    font-weight: 400;
    color: var(--ink-muted);
    background: transparent;
    border: 0;
    min-height: var(--chapter-tap);   /* area di tocco comoda sul telefono */
    padding: 0 8px;
    cursor: pointer;
    /* colonna: sotto il testo una copia invisibile in grassetto riserva la larghezza,
       così la riga non cambia quando il grassetto passa da un capitolo all'altro */
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #chapters button::after {
    content: attr(data-label);
    font-weight: 600;
    height: 0;
    overflow: hidden;
    visibility: hidden;
  }
  #chapters button[aria-current="true"] { color: var(--ink); font-weight: 600; }
  #chapters button:hover,
  #chapters button:focus-visible {
    text-decoration: underline;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    outline: none;
  }
  /* righe più vicine quando la riga va a capo (telefono): ogni pulsante resta alto 44 px ma
     occupa 44 − 2 × overlap px nella riga, quindi le aree di tocco di due righe vicine si
     sovrappongono di 2 × overlap. Il margine della lista restituisce lo spazio sopra la prima
     riga e sotto l'ultima: con una riga sola (desktop) l'impaginazione è identica a prima. */
  #chapters .chapters-list { margin-block: var(--chapter-row-overlap); }
  #chapters button { margin-block: calc(-1 * var(--chapter-row-overlap)); }
  /* controlli sotto la scena: play/pausa e cursore del tempo (non compaiono nel video) */
  #timeline {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 600px;
    margin: 8px auto 0;
  }
  #timeline[hidden], body.video #timeline { display: none; }
  #play {
    font: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--paper);
    background: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 6px 0 4px;
    min-width: 5.5em;
    cursor: pointer;
  }
  #play:focus-visible, #timeline input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #timeline input { flex: 1; min-width: 0; accent-color: var(--ink); cursor: pointer; }
  #timeline output {
    font-weight: 600;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    min-width: 6.5em;
    text-align: right;
  }
  /* la scena: formato fisso 4:5 (viewBox 560 × 700) */
  svg { display: block; width: 100%; max-width: 600px; height: auto; margin: 0 auto; }
  svg text { font-family: inherit; fill: var(--ink); }
  .muted { fill: var(--ink-muted); }
  footer {
    font-weight: 300;
    font-size: 0.8rem;
    color: var(--ink-muted);
    text-align: center;
    margin-top: 8px;
  }
  #error {
    background: #F3E3D3;
    border: 1px solid #844716;
    padding: 10px 14px;
    font-size: 0.9rem;
    margin: 12px 0;
  }
</style>
</head>
<body>
<main>
  <div id="error" hidden></div>
  <svg id="chart" role="img" aria-labelledby="chart-desc">
    <desc id="chart-desc">A plant with three branches inside a calendar ring. Each leaf is 10,000 men. Fallen leaves form a carpet on the ground, from left to right in the order they fell: Summer, Autumn, Frozen autumn.</desc>
  </svg>
  <div id="timeline">
    <button id="play" type="button">Play</button>
    <input id="day" type="range" min="0" max="173" step="1" value="0" aria-label="Day of the campaign">
    <output id="day-label" for="day"></output>
  </div>
  <nav id="chapters" aria-label="Key moments">
    <span class="chapters-label" aria-hidden="true">Key moments:</span>
    <div class="chapters-list"></div>
  </nav>
  <footer>1 leaf = 10,000 men (rounded). Km follow the main army as the crow flies between Minard’s points: the real march was longer. Some dates are estimates. Data: Minard (1869), via HistData.</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// =====================================================================
// SETTINGS: tutti i parametri visivi in un unico posto
// =====================================================================
const SETTINGS = {
  // file di dati (percorsi relativi a output/index.html, serve Live Server)
  files: {
    fiore: "data/fiore_giornaliero.csv",
    caduti: "data/petali_caduti.csv",
    tappe: "data/minard_tappe.csv",
  },

  // i tre fotogrammi della V1: non hanno più pulsanti, servono solo a ?frame=0|1|2
  // nell'indirizzo (test e video), come ?day=0…173
  frames: [
    { date: "1812-06-24", label: "24 Jun" },
    { date: "1812-09-14", label: "14 Sep" },
    { date: "1812-12-14", label: "14 Dec" },
  ],
  startFrame: 0,
  // capitoli (decisioni del 2 novembre): un pulsante per ogni nota di SETTINGS.notes, sotto i
  // controlli. Giorno ed etichetta ("24 Jun") si ricavano dal campo "from" della nota.
  // Al clic: pausa e salto allo stato del giorno, come con il cursore. Nascosti con ?video=1.
  showChapters: true,
  chapters: { ariaPrefix: "Jump to " },
  // controlli sotto la scena (play/pausa e cursore del tempo): sempre visibili, tranne con ?video=1
  showSlider: true,

  // animazione (design-spec §3 e §5, decisioni del 22 ottobre). Tempi in millisecondi.
  // Le animazioni delle foglie hanno tempi propri: possono continuare mentre i giorni avanzano.
  animation: {
    dayMs: 200,               // un giorno del calendario (174 giorni ≈ 35 s)
    slowdown: [1.5, 2.5],     // penultimo e ultimo giorno prima di una nota: 0,3 s e 0,5 s
    autoStartMs: 4000,        // partenza automatica dopo che la scena è entrata in vista
    autoStartVisible: 0.5,    // "in vista" = metà della scena (o metà della finestra) visibile
    maxFrameMs: 100,          // salto massimo dell'orologio tra due fotogrammi (scheda in secondo piano)
    // pausa = base + parole, min 2,5 s (27 ottobre; nella V11 1,5 s + 0,3 s per parola, min 3 s)
    note: { fadeMs: 300, baseMs: 1000, perWordMs: 250, minMs: 2500 },
    finale: { afterMs: 500, finalNoteMs: 2500 },   // 14 dicembre: ricomposizione, 0,5 s, N7, 2,5 s, nota finale
    // caduta: durata, sfalsamento tra foglie dello stesso giorno, dondolio (ampiezza in unità
    // del viewBox, numero di oscillazioni, rotazione massima del dondolio in gradi)
    fall: { ms: 1200, staggerMs: 150, sway: 7, swings: 2, spin: 18 },
    // 23 settembre: le foglie diventano marroni una per una, in ordine casuale ma fisso (seed),
    // distribuite su "ms"; ogni foglia passa da verde a marrone in "leafMs" (27 ottobre)
    autumn: { ms: 1500, leafMs: 200, seed: 7 },
    // 9 novembre: la brina arriva foglia per foglia, come l'autunno, con un altro seme, su "ms";
    // ogni foglia in "leafMs": prima colore e bordo interno, poi i puntini (27 ottobre).
    // Le foglie che cadono quel giorno partono quando tutta la chioma è brinata.
    frost: { ms: 1000, leafMs: 300, seed: 11 },
    migration: { ms: 1400, staggerMs: 200, arcLift: 60 },   // 26 novembre, ad arco sulla guida
    recompose: { ms: 2000, arcLift: 60 },                   // 14 dicembre, sulla mezza foglia
    branchTraceMs: 300,       // il ramo spoglio diventa traccia dopo che le foglie sono volate via
    reducedFadeMs: 300,       // prefers-reduced-motion: dissolvenze al posto dei voli
  },

  // note dei momenti (design-spec §4, "Testi delle annotazioni nella versione finale"):
  // ognuna si vede dal giorno "from" al giorno "to" compresi (date come in
  // fiore_giornaliero.csv). Ogni nota compare solo nel suo giorno (from = to); negli altri
  // giorni la colonna è vuota. Il tempo di lettura lo darà l'animazione, fermandosi su quel
  // giorno. "text" = paragrafi (uno o più).
  // Testi scelti il 22 ottobre (tutti ✓); N7 è seguita dalla nota finale sull'inverno.
  // "timing" (animazione, design-spec §3): "afterEvent" (se manca) = prima l'evento del giorno,
  // poi la nota; "withEvent" = la nota compare appena scatta il giorno, insieme all'evento, e la
  // riproduzione riparte quando sono finiti sia il tempo di lettura sia le animazioni (27 ottobre).
  notes: [
    { id: "N1", from: "1812-06-24", to: "1812-06-24",
      text: ["The march into Russia begins."] },
    { id: "N2", from: "1812-07-28", to: "1812-07-28",
      text: ["By late July, more than one man in three has vanished. No great battle yet: sickness, heat, hunger."] },
    { id: "N3", from: "1812-09-07", to: "1812-09-07",
      text: ["The great battle takes three leaves. The march had taken 24."] },
    { id: "N4", from: "1812-09-23", to: "1812-09-23",
      text: ["Summer ends in Moscow. Two men in three are already gone."] },
    { id: "N5", from: "1812-11-09", to: "1812-11-09", timing: "withEvent",
      text: ["First frost, −11 °C. 34 of 42 leaves had already fallen."] },   // "−11 °C" non va a capo
    { id: "N6", from: "1812-11-26", to: "1812-11-26", timing: "withEvent",
      text: ["30,000 men join at the Berezina. After the crossing, the main army counts 20,000."] },
    { id: "N7", from: "1812-12-14", to: "1812-12-14",
      text: ["4,000 back from Moscow, 6,000 who never went: the last leaf.",
             "Eight days later, on 22 Dec, winter began."] },
  ],

  // scala uomini → segni
  menPerLeaf: 10000,

  // palette B · Terra di Siena (design-spec.md)
  colors: {
    paper: "#FFFFFF",       // sfondo bianco dal 29 ottobre (V16; prima crema #FAF7F0)
    ink: "#2B2620",
    inkMuted: "#6E665B",
    track: "#E9E3D7",     // anello non ancora percorso
    verde: "#589A3C",
    marrone: "#844716",
    gelo: "#D2A679",      // frozen autumn: marrone chiaro, sempre con la brina (design-spec §6)
    frost: "#FFFFFF",     // brina: bordo interno e puntini della foglia gelata
    frostOutline: "#9A6B3E", // contorno sottile della foglia gelata (si stacca dallo sfondo)
    rule: "#CFC6B5",      // linea sottile tra parte fissa e parte che cambia
    branchTrace: "#A39783", // ramo laterale spoglio dopo il ricongiungimento (contrasto 2,9:1 con lo sfondo bianco)
    markTrace: "#958B7B",   // etichette e tacche dell'anello dopo il loro momento (contrasto 3,4:1)
  },

  // nomi dei tratti del tappeto a terra (testi visibili in inglese); nei dati la chiave resta "gelo"
  seasonNames: { verde: "Summer", marrone: "Autumn", gelo: "Frozen autumn" },

  // scena in formato 4:5 (unità del viewBox)
  width: 560,
  height: 700,

  // testi: dimensione in unità del viewBox, mai sotto minTextPx sullo schermo
  minTextPx: 12,
  // counter = numero degli uomini (grande), counterSmall = numero dei km (più piccolo)
  // ring / ringDate: nome e data delle etichette dell'anello (data circa 15% più piccola)
  text: { title: 32, subtitle: 14, date: 22, counter: 26, counterSmall: 18, counterLabel: 13,
          ring: 13, ringDate: 11, carpetSub: 13,
          note: 15 },   // 15 se tutte le note stanno nella colonna su desktop, altrimenti 14 per tutte
  // solo con ?video=1 (design-spec §7, 27 ottobre): note più grandi per il feed del telefono.
  // 17 è il massimo che sta nella colonna: a 18 la N7 arriva sull'etichetta Smolensk
  video: { note: 17 },
  // Le righe dell'intestazione sono impilate una sotto l'altra (titolo, sottotitolo,
  // linea, data, contatori): se il sottotitolo va a capo, tutto scende di conseguenza.
  // La data sta da sola al centro; sotto la sua riga i contatori, separati sulla stessa riga:
  // uomini a sinistra (margine "left"), km a destra (margine "right"). Impaginazione A.
  // rulePadPx: aria sopra e sotto la linea che separa la parte fissa da quella che cambia.
  // minGapPx: spazio minimo sullo schermo tra intestazione ed etichetta "Niemen".
  // Se manca (telefoni stretti), la scena sotto l'intestazione scende e diventa più alta del 4:5.
  header: { x: 280, left: 20, right: 540, titleY: 33, maxWidth: 520,
            rulePadPx: 6, ruleWidth: 80, minGapPx: 8 },

  // etichette dei contatori (design-spec.md, "Impaginazione A", 22 ottobre)
  counterLabels: {
    men: "men still marching",
    km: "km from the Niemen",
    kmSub: "main army",               // non mostrato quando la distanza è 0 (24 giugno)
  },

  // colonna delle note a destra dell'albero (impaginazione A): linea verticale sottile in
  // "x", testo da x + padLeft fino a x + width. In verticale va da sotto l'intestazione
  // (gapTop) fino sopra la prima etichetta dell'anello che le sta sotto (gapBottom).
  // Se sullo schermo il testo della colonna sarebbe più stretto di minPx, la nota va a tutta
  // larghezza sotto i contatori (telefoni) e la scena non si sposta (scene.shiftX vale solo
  // con la colonna). lineHeight e paragraphGap in em del testo delle note.
  noteColumn: { x: 412, width: 128, padLeft: 10, gapTop: 10, gapBottom: 6, minPx: 110,
                lineHeight: 1.3, paragraphGap: 0.6, ruleWidth: 1,
                fullGapTop: 10 },   // telefoni: aria tra contatori e nota a tutta larghezza

  // scena (anello, pianta, etichette dell'anello): spostamento orizzontale quando c'è la
  // colonna delle note. Terreno, tappeto e legenda non si spostano.
  scene: { shiftX: -50 },

  // testi fissi (provvisori, BRIEF.md 17 ottobre)
  title: "Leaves before the frost",
  // sottotitolo: una frase per riga (design-spec §4, "Impaginazione dei testi"); se una frase
  // non sta in una riga (telefono) va a capo normalmente
  subtitle: ["422,000 men marched into Russia in 1812.",
             "Four in five vanished before the first frost."],

  // UNA sola foglia per pianta e terreno: 1 foglia = 10.000 uomini
  // breakDepth: profondità del bordo spezzato della mezza foglia
  leaf: { length: 34, width: 10, breakDepth: 1.4 },

  ring: {
    // spostato a destra: a sinistra servono le etichette dell'anello
    // (con la colonna delle note tutta la scena si sposta di scene.shiftX)
    cx: 300, cy: 340,
    radius: 138,
    thickness: 14,
    // cursore della data (C3): punta di freccia color inchiostro alla fine del tratto
    // percorso, orientata in senso orario. length = lungo l'anello, width = di traverso
    cursor: { length: 11, width: 16 },
    labelGap: 8,          // distanza delle etichette dal bordo dell'anello
    // "Niemen / 24 Jun": sopra a destra del segno in cima. dx = distanza dal segno,
    // baseline = di quanto la riga di base della data sta sopra il bordo esterno dell'anello
    startLabel: { dx: 8, baseline: 6 },
    // sosta a Mosca (M3): parentesi fuori dall'anello lungo il tratto della sosta.
    // gap = distanza dal bordo esterno, tick = trattini alle estremità (verso l'anello),
    // trunkGap = metà del vuoto dove passa il tronco, labelGap = distanza dell'etichetta
    moscowBracket: { gap: 5, tick: 4, trunkGap: 5, labelGap: 8, labelAt: 0.75 },
  },

  // pianta a tre rami (design-spec, "La pianta ha tre rami"): un tronco che si divide
  // nella guida (centro, gruppo principale) e in due rami laterali sottili.
  // Coordinate [x, y] relative al centro dell'anello; i rami sono curve di Bézier
  // quadratiche (inizio = biforcazione, ctrl = punto che dà la curvatura, end = punta).
  plant: {
    fork: [0, 92],        // punto in cui il tronco si divide
    widths: { trunk: 3, guida: 2.25, lateral: 1.4, twig: 1.1 },
    leafSpread: 40,       // inclinazione delle foglie rispetto al ramo
    fallWeightX: 0.5,     // su ogni ramo cadono prima le foglie basse ed esterne
    // guida: foglia in punta + foglie sull'asse (t = posizione lungo la guida, 0–1)
    // + rametti alterni; "leaves" = foglie del rametto, compresa quella in punta
    guida: {
      ctrl: [-8, 0], end: [3, -92],
      axisLeaves: [{ t: 0.9, side: -1 }],
      twigs: [
        { t: 0.84, side: 1,  rise: 52, length: 40, leaves: 4 },
        { t: 0.72, side: -1, rise: 46, length: 54, leaves: 5 },
        { t: 0.6,  side: 1,  rise: 42, length: 62, leaves: 6 },
        { t: 0.48, side: -1, rise: 35, length: 72, leaves: 6 },
        { t: 0.36, side: 1,  rise: 36, length: 60, leaves: 6 },
        { t: 0.3,  side: -1, rise: 32, length: 56, leaves: 5 },
      ],
      twigFirstStop: 0.3, // prima foglia del rametto (frazione della lunghezza)
    },
    // rami laterali: "stops" = posizione delle foglie lungo il ramo; l'ultima (1) è la punta
    destra:   { ctrl: [70, 85],  end: [98, -5], stops: [0.4, 0.53, 0.66, 0.79, 0.9, 1] },
    sinistra: { ctrl: [-78, 94], end: [-100, -14], stops: [0.84, 1] },
  },
  // colonne dei dati per ramo; un ramo laterale diventa traccia dal giorno in cui
  // migrazione_oggi vale questo valore (le sue foglie sono passate sulla guida)
  branchData: {
    guida:    { column: "foglie_guida" },
    destra:   { column: "foglie_destra",   traceFrom: "destra_su_guida" },
    sinistra: { column: "foglie_sinistra", traceFrom: "sinistra_su_guida" },
  },

  ground: {
    y: 610,               // linea del terreno: tronco il più lungo possibile in 560 × 700 (V9)
    left: 16, right: 544, // larghezza utile (linea del terreno e tappeto)
  },

  // tappeto di foglie cadute (design-spec, "Foglie cadute"): si riempie da sinistra
  // nell'ordine di petali_caduti.csv, a colonne corte di "layers" foglie. Con tutte le
  // foglie cadute copre la larghezza utile. Rotazioni e spostamenti sono "casuali" ma
  // fissi (dipendono solo dal numero della foglia): stesso giorno = stessa immagine.
  carpet: {
    layers: 2,            // strati (foglie per colonna)
    layerHeight: 9,       // dislivello tra uno strato e quello sopra
    maxRotation: 14,      // rotazione massima delle foglie (gradi, ±)
    jitterX: 0.2,         // spostamento orizzontale massimo (frazione del passo tra colonne)
    jitterY: 2,           // sollevamento massimo dal suolo
    bracketGap: 6,        // distanza tra terreno e linea a parentesi sotto ogni tratto
    bracketTick: 3,       // altezza delle stanghette alle estremità della parentesi
    // legenda sotto il tappeto, sempre (design-spec, aggiornamento dopo la V6): una riga per
    // stagione con almeno una foglia, allineata a sinistra; spazio riservato per tre righe.
    // rowStep: distanza tra le righe (in em del testo); leafScale: dimensione della foglia
    // a inizio riga rispetto a quelle del tappeto; leafGap: spazio tra foglia e testo.
    legend: { rowStep: 1.3, leafScale: 0.55, leafGap: 6 },
    // riga piccola della legenda (design-spec §3, "Riga sull'arrotondamento", 27 ottobre): compare
    // con la prima riga della legenda. Peso 300, muted, stessa dimensione della nota in fondo
    // (letta dalla pagina), mai sotto minTextPx. Dove c'è spazio (desktop) sta ACCANTO alla
    // legenda: allineata a destra al bordo del tappeto, sulla linea di base della prima riga.
    // C'è spazio se la legenda più lunga (tre righe, numeri del 14 dicembre) + besideGap + la
    // riga stanno nella larghezza del tappeto: misurato dalla pagina, una sola posizione per
    // larghezza in tutti i giorni. Altrimenti (telefoni) sta SOTTO l'ultima riga visibile, a
    // gapEm (in em della riga), e lo spazio è riservato sotto la terza riga della legenda.
    roundingNote: { text: "Leaves are rounded: men lost are exact.", gapEm: 1.4, besideGap: 16 },

  // etichette dell'anello con tacca (design-spec §4, E2, E3, E5, E6): nome sopra, data sotto.
  // Compaiono il giorno "date", restano muted fino a "until" compreso (se manca: solo quel
  // giorno), poi diventano traccia. Niemen (E1) e Moscow (E4) sono disegnate a parte.
  ringMarks: [
    { key: "smolensk", date: "1812-08-17", lines: ["Smolensk", "17 Aug"] },
    { key: "borodino", date: "1812-09-07", lines: ["Borodino", "7 Sep"] },
    { key: "frost", date: "1812-11-09", lines: ["First frost", "9 Nov"] },
    { key: "berezina", date: "1812-11-26", until: "1812-11-29", lines: ["Berezina", "26–29 Nov"] },

  expected: {
    troopRows: 51,
    startMen: 422000,
    moscowMen: 139000,     // totale di tutti i gruppi il 14 settembre

// =====================================================================
// Funzioni di aiuto
// =====================================================================
const parseDate = d3.timeParse("%Y-%m-%d");
const fmtDate = d3.timeFormat("%-d %B %Y");
const fmtShort = d3.timeFormat("%-d %b %Y");
const fmtDay = d3.timeFormat("%-d %b");
const fmtNum = d3.format(",");
const rad = deg => deg * Math.PI / 180;

// angolo del calendario (0° in alto, senso orario) → coordinate
function polar(angleDeg, r) {
  return [SETTINGS.ring.cx + r * Math.sin(rad(angleDeg)),
          SETTINGS.ring.cy - r * Math.cos(rad(angleDeg))];
}

// arco come linea (si disegna con stroke, così si può tratteggiare)
function arcPath(a0, a1, r) {
  const [x0, y0] = polar(a0, r);
  const [x1, y1] = polar(a1, r);
  const large = (a1 - a0) > 180 ? 1 : 0;
  return `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1}`;
}

// forma della foglia: base in (0,0), punta in (L,0); larghezza massima circa 1,5 × W
function leafPath(L, W) {
  return `M0,0 C${L * 0.3},${-W} ${L * 0.7},${-W * 0.9} ${L},0 ` +
         `C${L * 0.7},${W * 0.9} ${L * 0.3},${W} 0,0 Z`;
}

// mezza foglia: la stessa foglia spezzata per il lungo, lungo la nervatura centrale.
// Resta il lato superiore, chiuso da un bordo spezzato (piccolo zig-zag sulla nervatura).
// Il 14 dicembre, nello stesso posto, torna la foglia intera.
function halfLeafPath(L, W) {
  const a = SETTINGS.leaf.breakDepth;   // profondità del bordo spezzato
  const zig = [0.84, 0.67, 0.5, 0.33, 0.16].map((f, i) => `L${(L * f).toFixed(2)},${i % 2 ? -a : a}`);
  return `M0,0 C${L * 0.3},${-W} ${L * 0.7},${-W * 0.9} ${L},0 ${zig.join(" ")} Z`;
}

// sagome usate per ritagliare il bordo interno della brina (una volta sola, in <defs>):
// il ritaglio usa le coordinate della foglia, quindi vale per tutte, comunque ruotate
function addLeafClips(svg) {
  const L = SETTINGS.leaf.length, W = SETTINGS.leaf.width;
  const defs = svg.append("defs");
  defs.append("clipPath").attr("id", "leaf-clip-full").append("path").attr("d", leafPath(L, W));
  defs.append("clipPath").attr("id", "leaf-clip-half").append("path").attr("d", halfLeafPath(L, W));
}

// disegna una foglia (intera o mezza) dentro un gruppo <g> già posizionato.
// Il primo <path> (classe "shape") è la sagoma della foglia: il test conta quelli.
function drawLeaf(g, colorKey, half = false) {
  const C = SETTINGS.colors, L = SETTINGS.leaf.length, W = SETTINGS.leaf.width;
  const d = half ? halfLeafPath(L, W) : leafPath(L, W);
  const frozen = colorKey === "gelo";
  g.append("path")
    .attr("class", "shape")
    .attr("d", d)
    .attr("fill", C[colorKey])
    .attr("stroke", frozen ? "none" : C.paper)   // la foglia gelata ha il suo contorno, sotto
    .attr("stroke-width", 1);
  if (!half) {
    g.append("line")           // nervatura centrale (nella mezza foglia è il bordo spezzato)
      .attr("x1", 2).attr("y1", 0)
      .attr("x2", L * 0.85).attr("y2", 0)
      .attr("stroke", "rgba(255,255,255,0.35)")
      .attr("stroke-width", 1);
  }
  if (frozen) {
    // brina: bordo bianco interno (tratto largo ritagliato dentro la sagoma) e puntini
    g.append("path")
      .attr("d", d)
      .attr("fill", "none")
      .attr("stroke", C.frost)
      .attr("stroke-width", 2.6)
      .attr("clip-path", `url(#leaf-clip-${half ? "half" : "full"})`);
    [[0.28, -0.32], [0.5, 0.3], [0.68, -0.22], [0.82, 0.12]]
      .filter(([, fy]) => !half || fy < 0).forEach(([fx, fy]) => {   // mezza foglia: solo il lato rimasto
      g.append("circle")
        .attr("cx", L * fx).attr("cy", W * fy)
        .attr("r", 1.3)
        .attr("fill", C.frost);
    });
    // contorno sottile più scuro, sopra la brina: sul bianco dello sfondo la brina da sola non si vede
    g.append("path")
      .attr("d", d)
      .attr("fill", "none")
      .attr("stroke", C.frostOutline)
      .attr("stroke-width", 0.9);
  }
}

// numero "casuale" ma fisso tra 0 e 1, dato un seme (il numero della foglia) e un indice
function seeded(seed, k) {
  const x = Math.sin(seed * 12.9898 + k * 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// testo su più righe: ogni riga è un <tspan>; "align" = top | bottom;
// "size" = una dimensione per tutte le righe, "sizes" = una per riga
function multiline(parent, x, y, lines, opts = {}) {
  const t = parent.append("text")
    .attr("x", x).attr("y", y)
    .attr("text-anchor", opts.anchor ?? "middle")
    .attr("class", opts.cls ?? null);
  lines.forEach((line, i) => {
    const first = i === 0;
    const dy = first
      ? (opts.align === "bottom" ? `${-(lines.length - 1) * 1.2}em` : (opts.firstDy ?? "0.8em"))
      : "1.2em";
    t.append("tspan")
      .attr("x", x).attr("dy", dy)
      .attr("data-size", opts.sizes ? opts.sizes[i] : opts.size)
      .text(line);
  });
  return t;
}
